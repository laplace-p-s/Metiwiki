# Metiwikiの実行用イメージ（配布用zipのdocker/Dockerfile）のApache設定

ServerName localhost
# 応答ヘッダーやエラーページにApacheのバージョンを出さない
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/metiwiki/public

    <Directory /var/www/metiwiki/public>
        # public/.htaccess（index.phpへのルーティング）を使う
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    # 公式イメージでは標準出力・標準エラーにつながっている（docker compose logsで見られる）
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
