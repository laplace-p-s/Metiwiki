; Metiwikiの実行用イメージ（配布用zipのdocker/Dockerfile）のPHP設定

; 本番向け
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

; LARAVEL_STORAGE_PATHなどのコンテナの環境変数を$_ENVから読めるようにする
variables_order = EGPCS

; 画像アップロード。実際の上限はアプリのWIKI_UPLOAD_MAX_KB（既定5MB）との小さい方になるので、
; ここはWIKI_UPLOAD_MAX_KBを上げられる余裕を持たせておく
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M

; コードはイメージに固定されているので、ファイルの更新確認をしない
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
